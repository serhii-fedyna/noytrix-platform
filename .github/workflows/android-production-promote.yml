name: Promote existing Android build to Production

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Internal Testing workflow run ID
        required: true
        type: string
      artifact_name:
        description: Exact signed AAB artifact name
        required: true
        type: string
      confirm_version_code:
        description: Version code that must be promoted
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: noytrix-android-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote signed AAB to Google Play Production
    runs-on: ubuntu-22.04
    steps:
      - name: Validate explicit production target
        run: |
          test "${{ inputs.source_run_id }}" = "33110729640"
          test "${{ inputs.artifact_name }}" = "noytrix-android-internal-test-aab-48"
          test "${{ inputs.confirm_version_code }}" = "400"

      - name: Download signed build 400 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download "${{ inputs.source_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.artifact_name }}" \
            --dir release
          test -s release/noytrix-internal-test.aab

      - name: Promote existing versionCode 400 to Google Play Production
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          npm install --no-save googleapis@144
          node <<'NODE'
          const { google } = require('googleapis');

          async function promote() {
            const credentials = JSON.parse(process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON);
            const auth = new google.auth.GoogleAuth({
              credentials,
              scopes: ['https://www.googleapis.com/auth/androidpublisher'],
            });
            const publisher = google.androidpublisher({ version: 'v3', auth });
            const packageName = 'com.noytrix.app';
            const edit = await publisher.edits.insert({ packageName });
            const editId = edit.data.id;
            if (!editId) throw new Error('Google Play edit ID was not returned');
            await publisher.edits.tracks.update({
              packageName,
              editId,
              track: 'production',
              requestBody: {
                track: 'production',
                releases: [{
                  name: 'Noytrix 1.0.82 (400)',
                  status: 'completed',
                  versionCodes: ['400'],
                }],
              },
            });
            await publisher.edits.commit({ packageName, editId });
            console.log('PROMOTED_VERSION_CODE=400 TRACK=production STATUS=completed');
          }

          promote().catch((error) => {
            console.error(error?.response?.data || error);
            process.exit(1);
          });
          NODE
