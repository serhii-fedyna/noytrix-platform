name: Android Production Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noytrix-android-internal-release
  cancel-in-progress: false

jobs:
  test:
    name: Mobile checks
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript tests when present
        run: npm test --if-present

      - name: Validate Expo configuration
        run: npx expo config --json > /tmp/noytrix-expo-config.json

      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir .ci-export --no-bytecode

  build-and-upload:
    name: Build signed AAB and upload to Google Play Production
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Bump Android versionCode
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const appPath = 'mobile/app.json';
          const gradlePath = 'mobile/android/app/build.gradle';
          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          const current = Number(app.expo?.android?.versionCode);
          if (!Number.isInteger(current) || current < 1) {
            throw new Error(`Invalid android.versionCode: ${current}`);
          }
          const next = current + 1;
          app.expo.android.versionCode = next;
          fs.writeFileSync(appPath, JSON.stringify(app, null, 2) + '\n');

          const gradle = fs.readFileSync(gradlePath, 'utf8');
          const updated = gradle.replace(/(versionCode\s+)\d+/, `$1${next}`);
          if (updated === gradle) throw new Error('Native versionCode was not found in build.gradle');
          fs.writeFileSync(gradlePath, updated);
          console.log(`Android versionCode: ${current} -> ${next}`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app.json mobile/android/app/build.gradle
          git commit -m "chore: bump Android versionCode [skip ci]"
          git push origin HEAD:master

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Restore Google services configuration
        shell: bash
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > mobile/google-services.json
          test -s mobile/google-services.json

      - name: Check release configuration
        working-directory: mobile
        run: |
          node -e "const c=require('./eas.json'); if(c.cli?.appVersionSource!=='local') throw new Error('Expected local app version source'); if(c.build?.production?.autoIncrement!==false) throw new Error('CI must persist the versionCode bump'); if(c.build?.production?.android?.buildType!=='app-bundle') throw new Error('Production build must be an AAB'); const a=require('./app.json'); const g=require('fs').readFileSync('android/app/build.gradle','utf8'); const v=String(a.expo.android.versionCode); if(!g.includes('versionCode '+v)) throw new Error('app.json and native versionCode differ'); console.log('Building Android versionCode '+v);"
          npx expo config --json > /tmp/noytrix-release-config.json

      - name: Build signed Android App Bundle with EAS
        working-directory: mobile
        shell: bash
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@21.0.2 build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json > "$RUNNER_TEMP/eas-build.json"

      - name: Download AAB from EAS
        working-directory: mobile
        shell: bash
        env:
          EAS_RESULT: ${{ runner.temp }}/eas-build.json
        run: |
          mkdir -p artifacts
          BUILD_URL="$(node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync(process.env.EAS_RESULT, 'utf8'));
          function findUrl(value) {
            if (!value || typeof value !== 'object') return '';
            for (const key of ['buildUrl', 'applicationArchiveUrl']) {
              if (typeof value[key] === 'string' && value[key].startsWith('http')) return value[key];
            }
            for (const item of Object.values(value)) {
              const found = findUrl(item);
              if (found) return found;
            }
            return '';
          }
          const url = findUrl(data);
          if (!url) throw new Error('EAS did not return an Android artifact URL');
          process.stdout.write(url);
          NODE
          )"
          curl --fail --location --retry 3 "$BUILD_URL" --output artifacts/noytrix-release.aab
          test -s artifacts/noytrix-release.aab

      - name: Upload AAB as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: noytrix-android-aab-${{ github.run_number }}
          path: mobile/artifacts/noytrix-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Google Play Production
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.noytrix.app
          releaseFiles: mobile/artifacts/noytrix-release.aab
          tracks: production
          status: completed
