name: Build Trading Center for macOS

on:
  workflow_dispatch:

jobs:
  package-macos-demo:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: trading-center-mac
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trading-center-mac/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build unsigned Mac application
        run: npm run build:mac
      - name: Upload Mac application ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Noytrix-Trading-Center-macOS-unsigned
          path: trading-center-mac/dist/*.zip
          if-no-files-found: error
