[Service]
# API restarts must not terminate a separately supervised live worker.
KillMode=process
EnvironmentFile=-/root/trader-bot/ops.env
Environment=QANTOVA_WORKER_AUTO_RECOVERY_ENABLED=1
Environment=QANTOVA_WORKER_SUPERVISOR_INTERVAL_SECONDS=30
Environment=QANTOVA_WORKER_HEARTBEAT_STALE_SECONDS=180

